<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Training log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#E9EDF0;--surface:#FFFFFF;--ink:#16212B;--muted:#56636F;--line:#C9D1D8;--field:#F3F5F7;
  --blue:#1D4ED8;--red:#C8102E;--green:#17784A;--yellow:#F2B705;
  /* competition plate colours: 25 red, 20 blue, 15 yellow, 10 green */
  --plate-upper:#C8102E;--plate-lower:#1D4ED8;--plate-push:#F2B705;--plate-pull:#17784A;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F151B;--surface:#18212A;--ink:#E6ECF1;--muted:#94A2AF;--line:#2B3743;--field:#111920;
        --blue:#6B95FF;--red:#FF5C70;--green:#3CCF86;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cond{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font:700 24px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;margin:0;white-space:nowrap}
nav{display:flex;gap:2px}
nav button{background:none;border:0;color:var(--muted);font:600 16px/1 Barlow,sans-serif;
  padding:10px 10px;border-radius:6px;cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
/* narrow phones: drop the title, tabs share the full width */
@media (max-width:400px){
  .brand{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  nav{flex:1;justify-content:space-between}
  nav button{flex:1;padding:10px 4px;font-size:16px}
}

main{padding:20px 0 calc(140px + env(safe-area-inset-bottom,0px))}
.h{font:700 40px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;margin:0 0 16px}
.muted{color:var(--muted)}
p{margin:0}

/* day picker */
.day{display:grid;grid-template-columns:12px 1fr;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px 14px 0;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer;overflow:hidden}
.stripe{background:var(--plate);border-radius:0 4px 4px 0}
.day-name{display:flex;align-items:center;gap:10px;font:700 34px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif}
.next{font:600 13px/1 Barlow,sans-serif;background:var(--ink);color:var(--bg);padding:5px 8px;border-radius:99px}
.day-list{display:block;color:var(--muted);font-size:14px;margin-top:6px}
.ramp{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:15px}
.ramp input{width:20px;height:20px;margin:1px 0 0;flex:none}

/* session */
.session-head{display:flex;gap:14px;align-items:stretch;margin-bottom:16px}
.session-head .stripe{width:12px;border-radius:4px;flex:none}
.session-head .h{margin:0 0 4px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.ex h2{font:600 19px/1.25 Barlow,sans-serif;margin:0}
.meta{font-size:14px;color:var(--muted);margin-top:4px}
.last{font-size:14px;margin-top:8px}
.badge{display:inline-block;font:600 14px/1.2 Barlow,sans-serif;padding:7px 10px;border-radius:6px;
  margin-top:10px;background:var(--field);border:1px solid var(--line)}
.badge.up{background:var(--red);border-color:var(--red);color:#fff}
.sets{margin-top:14px;display:grid;gap:8px}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 56px;gap:8px;align-items:center}
.set.head{font-size:13px;color:var(--muted);text-align:center}
.set-n{font:600 20px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;color:var(--muted);text-align:center}
.num{width:100%;height:56px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);
  font:600 30px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;text-align:center;padding:0 4px;
  font-variant-numeric:tabular-nums}
.num::placeholder{color:var(--muted);opacity:.5}
.tick{height:56px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--muted);
  font:700 24px/1 Barlow,sans-serif;cursor:pointer}
.set.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.set.done .num{border-color:var(--green)}
.set.saving{opacity:.55;pointer-events:none}

.primary{width:100%;height:56px;border:0;border-radius:10px;background:var(--blue);color:#fff;
  font:700 22px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;margin-top:8px;cursor:pointer}
.text-btn{display:block;margin:16px auto 0;background:none;border:0;color:var(--muted);
  font:500 15px Barlow,sans-serif;text-decoration:underline;cursor:pointer;padding:8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* rest timer */
#timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#timer[hidden]{display:none}
#timer .wrap{display:flex;align-items:center;gap:10px;padding:0}
#timer-text{margin-right:auto;display:flex;flex-direction:column}
#timer-label{font-size:14px}
#timer-num{font:700 40px/1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
#timer button{height:44px;padding:0 14px;border-radius:8px;border:1px solid currentColor;background:transparent;
  color:inherit;font:600 16px Barlow,sans-serif;cursor:pointer}
#timer.over{background:var(--yellow);color:#16212B}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:15px;max-width:90vw;z-index:20}
#toast:empty{display:none}

/* history */
details.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
details.hist summary{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;
  padding:12px 14px 12px 0;cursor:pointer;list-style:none}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary .stripe{align-self:stretch}
details.hist summary strong{display:block;font:700 24px/1.1 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif}
details.hist summary .muted{font-size:14px}
.hist ul{list-style:none;margin:0;padding:0 14px 12px 20px}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.nums{font-variant-numeric:tabular-nums;text-align:right}

/* progress */
.field{display:grid;gap:6px;font-size:14px;color:var(--muted);margin-bottom:16px}
select{height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:500 16px Barlow,sans-serif;padding:0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.panel h2{font:600 16px Barlow,sans-serif;margin:0 0 8px}
svg{display:block;width:100%;height:auto}
svg .grid{stroke:var(--line);stroke-width:1}
svg .line{stroke:var(--blue);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
svg .dot{fill:var(--blue)}
svg .lbl{fill:var(--muted);font:500 11px Barlow,sans-serif}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 0;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px}
.r{text-align:right;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted)}
.setup code{background:var(--field);padding:2px 5px;border-radius:4px;font-size:14px}
.setup ol{padding-left:20px;margin:10px 0 0}
.setup li{margin-bottom:6px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="brand">Training log</p>
    <nav aria-label="Sections">
      <button data-view="today" aria-current="page">Today</button>
      <button data-view="history">History</button>
      <button data-view="progress">Progress</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>

<div id="timer" hidden role="timer" aria-live="off">
  <div class="wrap">
    <div id="timer-text"><span id="timer-label">Rest</span><span id="timer-num">2:00</span></div>
    <button data-act="add30">+30 s</button>
    <button data-act="skip">Close</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- config: fill these in (Supabase: Project Settings -> API) ---------- */
const SUPABASE_URL = "https://wtuwbqgbkpbtnavnsmip.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0dXdicWdia3BidG5hdm5zbWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NjEyNTcsImV4cCI6MjEwNjMzNzI1N30.owUZhsznOi914FJVywir4WmBw8zl2JCkjAEo3E2YwkQ";

/* ---------- programme: edit here to change exercises ----------
   id      stable key stored in the database; keep it the same if you rename an exercise
   sets    working sets; min/max rep range; rest in seconds
   inc     load jump (kg) suggested once every set hits the top of the range
   compound true = 1–2 reps in reserve, false = last set to failure              */
const PROGRAMME = {
  upper: { name: "Upper", exercises: [
    { id:"db-bench-press", name:"Dumbbell bench press", sets:3, min:6, max:10, rest:120, inc:2, compound:true, note:"Weight per dumbbell" },
    { id:"tbar-row", name:"Chest-supported T-bar row", sets:3, min:6, max:10, rest:120, inc:2.5, compound:true },
    { id:"lat-pulldown", name:"Lat pulldown", sets:3, min:8, max:12, rest:120, inc:2.5, compound:true },
    { id:"cable-lateral-raise", name:"Cable lateral raise", sets:2, min:12, max:20, rest:60, inc:1 },
    { id:"oh-triceps-ext", name:"Overhead cable triceps extension", sets:2, min:10, max:15, rest:90, inc:2.5, superset:"incline-db-curl" },
    { id:"incline-db-curl", name:"Incline dumbbell curl", sets:2, min:10, max:15, rest:90, inc:2, superset:"oh-triceps-ext", note:"Weight per dumbbell" },
  ]},
  lower: { name: "Lower", exercises: [
    { id:"squat", name:"High-bar squat or hack squat", sets:3, min:5, max:8, rest:120, inc:2.5, compound:true },
    { id:"rdl", name:"Romanian deadlift", sets:3, min:6, max:10, rest:120, inc:2.5, compound:true },
    { id:"seated-leg-curl", name:"Seated leg curl", sets:3, min:10, max:15, rest:90, inc:2.5 },
    { id:"leg-press", name:"Leg press", sets:3, min:8, max:12, rest:120, inc:5, compound:true },
    { id:"leg-extension", name:"Leg extension", sets:2, min:12, max:15, rest:90, inc:2.5 },
  ]},
  push: { name: "Push", exercises: [
    { id:"incline-db-press", name:"Incline dumbbell press", sets:3, min:8, max:12, rest:120, inc:2, compound:true, note:"Weight per dumbbell" },
    { id:"machine-chest-press", name:"Machine chest press or weighted dips", sets:3, min:8, max:12, rest:120, inc:2.5, compound:true },
    { id:"machine-shoulder-press", name:"Machine shoulder press", sets:2, min:8, max:12, rest:120, inc:2.5, compound:true },
    { id:"pec-deck", name:"Pec deck / cable fly", sets:2, min:12, max:15, rest:90, inc:2.5 },
    { id:"cable-lateral-raise", name:"Cable lateral raise", sets:3, min:12, max:20, rest:60, inc:1 },
    { id:"oh-triceps-ext", name:"Overhead cable triceps extension", sets:2, min:10, max:15, rest:90, inc:2.5 },
  ]},
  pull: { name: "Pull", exercises: [
    { id:"pull-up", name:"Weighted pull-up or neutral-grip pulldown", sets:3, min:6, max:10, rest:120, inc:2.5, compound:true, note:"For pull-ups, log added weight only (0 = bodyweight)" },
    { id:"seated-cable-row", name:"Seated cable row", sets:3, min:8, max:12, rest:120, inc:2.5, compound:true },
    { id:"lat-pullover", name:"Cable lat pullover", sets:2, min:10, max:15, rest:90, inc:2.5 },
    { id:"rear-delt-cable-fly", name:"Rear delt cable fly", sets:3, min:12, max:20, rest:60, inc:1 },
    { id:"cable-lateral-raise", name:"Cable lateral raise", sets:2, min:12, max:20, rest:60, inc:1 },
    { id:"bayesian-curl", name:"Bayesian cable curl", sets:3, min:10, max:15, rest:90, inc:1 },
    { id:"hammer-curl", name:"Hammer curl", sets:2, min:10, max:12, rest:60, inc:2, note:"Weight per dumbbell" },
  ]},
};
const ORDER = ["upper", "lower", "push", "pull"];

/* ---------- state ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const NAMES = {};
for (const k of ORDER) for (const e of PROGRAMME[k].exercises) NAMES[e.id] = e.name;

const S = {
  view: "today",
  session: null,      // active sessions row
  logged: {},         // "exercise|set_no" -> saved set
  prev: {},           // exercise -> sets from the most recent earlier session
  nextDay: "upper",
  ramp: localStorage.getItem("gymlog_ramp") === "1",
  progEx: null,
};
let db = null;

/* ---------- helpers ---------- */
const fmtW = w => String(Math.round(Number(w) * 100) / 100);
const fmtRest = s => s < 60 ? `${s} s` : (s % 60 ? `${Math.floor(s/60)} min ${s%60} s` : `${s/60} min`);
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
const fmtTime = iso => new Date(iso).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
const fmtClock = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const setsFor = e => S.ramp ? Math.max(1, e.sets - 1) : e.sets;
const dayEx = id => PROGRAMME[S.session.day].exercises.find(e => e.id === id);
const epley = (w, r) => Number(w) * (1 + r / 30);

let toastT;
function toast(msg) {
  $("#toast").textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => ($("#toast").textContent = ""), 3500);
}

function suggest(e, prev) {
  if (!prev.length) return null;
  const top = Math.max(...prev.map(s => Number(s.weight_kg)));
  const up = prev.every(s => s.reps >= e.max);
  return { up, weight: up ? top + e.inc : top };
}

/* ---------- data ---------- */
async function loadNext() {
  const { data } = await db.from("sessions").select("day")
    .not("finished_at", "is", null).order("started_at", { ascending:false }).limit(1);
  S.nextDay = data && data[0] ? ORDER[(ORDER.indexOf(data[0].day) + 1) % ORDER.length] : "upper";
}

async function loadPrev() {
  const ids = [...new Set(PROGRAMME[S.session.day].exercises.map(e => e.id))];
  const { data, error } = await db.from("sets")
    .select("exercise,set_no,weight_kg,reps,session_id,created_at")
    .in("exercise", ids).neq("session_id", S.session.id)
    .order("created_at", { ascending:false }).limit(500);
  S.prev = {};
  if (error) return toast("Could not load your previous sets.");
  const latest = {};
  for (const s of data) {
    if (!(s.exercise in latest)) latest[s.exercise] = s.session_id;
    if (latest[s.exercise] === s.session_id) (S.prev[s.exercise] ??= []).push(s);
  }
  for (const k in S.prev) S.prev[k].sort((a, b) => a.set_no - b.set_no);
}

async function resume() {
  const id = localStorage.getItem("gymlog_active");
  if (!id) return;
  const { data } = await db.from("sessions").select("*").eq("id", id).is("finished_at", null).maybeSingle();
  if (!data) { localStorage.removeItem("gymlog_active"); return; }
  S.session = data;
  const { data: sets } = await db.from("sets").select("*").eq("session_id", data.id);
  S.logged = {};
  for (const s of sets || []) S.logged[`${s.exercise}|${s.set_no}`] = s;
  await loadPrev();
}

async function start(day) {
  const { data, error } = await db.from("sessions").insert({ day }).select().single();
  if (error) return toast("Could not start the session. Check the Supabase URL and key.");
  S.session = data; S.logged = {};
  localStorage.setItem("gymlog_active", data.id);
  await loadPrev();
  render(); window.scrollTo(0, 0);
}

function readRow(row) {
  const wi = row.querySelector('[data-f="w"]'), ri = row.querySelector('[data-f="r"]');
  const w = parseFloat((wi.value || wi.placeholder).replace(",", "."));
  const r = parseInt(ri.value, 10);
  if (!(w >= 0)) { toast("Enter the weight in kg."); wi.focus(); return null; }
  if (!(r >= 1 && r <= 100)) { toast("Enter the reps you did."); ri.focus(); return null; }
  return { w, r, wi, ri };
}

async function saveRow(row, startRest) {
  const ex = row.dataset.ex, n = +row.dataset.n;
  const v = readRow(row);
  if (!v) return;
  const rec = { session_id:S.session.id, exercise:ex, set_no:n, weight_kg:v.w, reps:v.r };
  row.classList.add("saving");
  const { error } = await db.from("sets").upsert(rec, { onConflict:"session_id,exercise,set_no" });
  row.classList.remove("saving");
  if (error) return toast("Set not saved. Check your connection and tap ✓ again.");
  S.logged[`${ex}|${n}`] = rec;
  v.wi.value = fmtW(v.w); v.ri.value = v.r;
  row.classList.add("done");
  row.querySelector(".tick").setAttribute("aria-label", `Undo set ${n}`);
  if (startRest) startTimer(dayEx(ex).rest);
}

async function tick(row) {
  const ex = row.dataset.ex, n = +row.dataset.n, key = `${ex}|${n}`;
  if (!S.logged[key]) return saveRow(row, true);
  row.classList.add("saving");
  const { error } = await db.from("sets").delete().match({ session_id:S.session.id, exercise:ex, set_no:n });
  row.classList.remove("saving");
  if (error) return toast("Could not undo that set. Try again.");
  delete S.logged[key];
  row.classList.remove("done");
  row.querySelector(".tick").setAttribute("aria-label", `Log set ${n}`);
}

async function finish() {
  if (!Object.keys(S.logged).length) {
    if (!confirm("No sets logged yet. Discard this session?")) return;
    return discard(true);
  }
  const { error } = await db.from("sessions").update({ finished_at:new Date().toISOString() }).eq("id", S.session.id);
  if (error) return toast("Could not finish the session. Try again.");
  await endSession();
  toast("Session saved");
}

async function discard(confirmed) {
  if (!confirmed && !confirm("Discard this session and every set in it?")) return;
  const { error } = await db.from("sessions").delete().eq("id", S.session.id);
  if (error) return toast("Could not discard the session. Try again.");
  await endSession();
  toast("Session discarded");
}

async function endSession() {
  localStorage.removeItem("gymlog_active");
  S.session = null; S.logged = {}; S.prev = {};
  stopTimer();
  await loadNext();
  render(); window.scrollTo(0, 0);
}

/* ---------- rest timer ---------- */
const T = { end:0, id:null };
function startTimer(sec) {
  T.end = Date.now() + sec * 1000;
  $("#timer").hidden = false;
  $("#timer").classList.remove("over");
  $("#timer-label").textContent = "Rest";
  clearInterval(T.id);
  T.id = setInterval(tickTimer, 250);
  tickTimer();
}
function tickTimer() {
  const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
  $("#timer-num").textContent = fmtClock(left);
  if (left === 0) {
    clearInterval(T.id);
    $("#timer").classList.add("over");
    $("#timer-label").textContent = "Rest over";
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
}
function stopTimer() { clearInterval(T.id); $("#timer").hidden = true; }

/* ---------- views ---------- */
function render() {
  document.querySelectorAll("nav button").forEach(b =>
    b.dataset.view === S.view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (S.view === "history") return renderHistory();
  if (S.view === "progress") return renderProgress();
  S.session ? renderSession() : renderPicker();
}

function renderPicker() {
  app.innerHTML = `
    <h1 class="h">Pick today's session</h1>
    ${ORDER.map(k => `
      <button class="day" data-start="${k}" style="--plate:var(--plate-${k})">
        <span class="stripe"></span>
        <span>
          <span class="day-name">${PROGRAMME[k].name}${S.nextDay === k ? '<span class="next">Up next</span>' : ""}</span>
          <span class="day-list">${PROGRAMME[k].exercises.map(e => e.name).join(", ")}</span>
        </span>
      </button>`).join("")}
    <label class="ramp"><input type="checkbox" id="ramp" ${S.ramp ? "checked" : ""}>
      <span>Return ramp: one fewer set per exercise. Use for your first two weeks back, then switch off.</span></label>`;
}

function exerciseCard(e) {
  const n = setsFor(e), prev = S.prev[e.id] || [], sug = suggest(e, prev);
  const effort = e.compound ? "1–2 reps in reserve" : "last set to failure";
  const last = prev.length
    ? `Last time: ${prev.map(s => `${fmtW(s.weight_kg)} × ${s.reps}`).join(", ")}`
    : "First time logging this exercise";
  const badge = !sug ? "" : sug.up
    ? `<p class="badge up">Add weight: ${fmtW(sug.weight)} kg</p>`
    : `<p class="badge">Stay at ${fmtW(sug.weight)} kg and add reps</p>`;
  let rows = "";
  for (let i = 1; i <= n; i++) {
    const L = S.logged[`${e.id}|${i}`], p = prev[i - 1];
    const wph = sug ? fmtW(sug.weight) : "";
    const rph = sug && sug.up ? e.min : (p ? p.reps : "");
    rows += `
      <div class="set${L ? " done" : ""}" data-ex="${e.id}" data-n="${i}">
        <span class="set-n">${i}</span>
        <input class="num" data-f="w" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="Set ${i} weight in kg"
          value="${L ? fmtW(L.weight_kg) : ""}" placeholder="${wph}">
        <input class="num" data-f="r" inputmode="numeric" enterkeyhint="done" autocomplete="off" aria-label="Set ${i} reps"
          value="${L ? L.reps : ""}" placeholder="${rph}">
        <button class="tick" data-act="tick" aria-label="${L ? "Undo" : "Log"} set ${i}">✓</button>
      </div>`;
  }
  return `
    <article class="ex">
      <h2>${e.name}</h2>
      <p class="meta">${n} × ${e.min}–${e.max} reps, rest ${fmtRest(e.rest)}, ${effort}${e.superset ? `. Superset with ${NAMES[e.superset].toLowerCase()}` : ""}${e.note ? `. ${e.note}` : ""}</p>
      <p class="last">${last}</p>
      ${badge}
      <div class="sets">
        <div class="set head" aria-hidden="true"><span></span><span>kg</span><span>reps</span><span></span></div>
        ${rows}
      </div>
    </article>`;
}

function renderSession() {
  const d = PROGRAMME[S.session.day];
  app.innerHTML = `
    <div class="session-head" style="--plate:var(--plate-${S.session.day})">
      <span class="stripe"></span>
      <div><h1 class="h">${d.name}</h1><p class="muted">Started ${fmtTime(S.session.started_at)}${S.ramp ? ", return ramp on" : ""}</p></div>
    </div>
    ${d.exercises.map(exerciseCard).join("")}
    <button class="primary" data-act="finish">Finish session</button>
    <button class="text-btn" data-act="discard">Discard session</button>`;
}

async function renderHistory() {
  app.innerHTML = `<h1 class="h">History</h1><p class="muted">Loading…</p>`;
  const { data, error } = await db.from("sessions")
    .select("id,day,started_at,finished_at,sets(exercise,set_no,weight_kg,reps)")
    .not("finished_at", "is", null).order("started_at", { ascending:false }).limit(40);
  if (S.view !== "history") return;
  if (error) { app.innerHTML = `<h1 class="h">History</h1><p class="empty">Could not load history. Check your connection.</p>`; return; }
  if (!data.length) { app.innerHTML = `<h1 class="h">History</h1><p class="empty">No finished sessions yet. Start one from Today.</p>`; return; }
  app.innerHTML = `<h1 class="h">History</h1>` + data.map(s => {
    const order = (PROGRAMME[s.day]?.exercises || []).map(e => e.id);
    const groups = {};
    for (const x of s.sets) (groups[x.exercise] ??= []).push(x);
    const exs = Object.keys(groups).sort((a, b) => order.indexOf(a) - order.indexOf(b));
    const vol = s.sets.reduce((t, x) => t + Number(x.weight_kg) * x.reps, 0);
    return `
      <details class="hist" style="--plate:var(--plate-${s.day})">
        <summary>
          <span class="stripe"></span>
          <span><strong>${PROGRAMME[s.day]?.name || s.day}</strong><span class="muted">${fmtDate(s.started_at)}</span></span>
          <span class="muted nums">${s.sets.length} sets<br>${Math.round(vol).toLocaleString("en-GB")} kg</span>
        </summary>
        <ul>${exs.map(ex => `<li><span>${NAMES[ex] || ex}</span><span class="nums">${
          groups[ex].sort((a, b) => a.set_no - b.set_no).map(x => `${fmtW(x.weight_kg)} × ${x.reps}`).join(", ")}</span></li>`).join("")}</ul>
      </details>`;
  }).join("");
}

function chart(points) {
  const W = 320, H = 150, P = 26;
  const vs = points.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi - lo < 2) { hi += 1; lo -= 1; }
  const x = i => points.length === 1 ? W / 2 : P + i * (W - 2 * P) / (points.length - 1);
  const y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
  const pts = points.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  return `
    <svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Estimated 1RM from ${Math.round(points[0].v)} kg to ${Math.round(points.at(-1).v)} kg over ${points.length} sessions">
      <line class="grid" x1="${P}" x2="${W - P}" y1="${y(hi)}" y2="${y(hi)}"/>
      <line class="grid" x1="${P}" x2="${W - P}" y1="${y(lo)}" y2="${y(lo)}"/>
      <text class="lbl" x="${P}" y="${y(hi) - 7}">${Math.round(hi)} kg</text>
      <text class="lbl" x="${P}" y="${y(lo) + 16}">${Math.round(lo)} kg</text>
      <polyline class="line" points="${pts}"/>
      ${points.map((p, i) => `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"/>`).join("")}
    </svg>`;
}

async function renderProgress() {
  const all = [];
  for (const k of ORDER) for (const e of PROGRAMME[k].exercises) if (!all.some(a => a.id === e.id)) all.push(e);
  const sel = S.progEx || all[0].id;
  app.innerHTML = `
    <h1 class="h">Progress</h1>
    <label class="field">Exercise
      <select id="exsel">${all.map(e => `<option value="${e.id}"${e.id === sel ? " selected" : ""}>${e.name}</option>`).join("")}</select>
    </label>
    <div id="prog"><p class="muted">Loading…</p></div>`;
  const { data, error } = await db.from("sets")
    .select("weight_kg,reps,session_id,sessions(started_at,finished_at)")
    .eq("exercise", sel).limit(2000);
  const box = $("#prog");
  if (!box || S.view !== "progress") return;
  if (error) { box.innerHTML = `<p class="empty">Could not load progress. Check your connection.</p>`; return; }
  const by = {};
  for (const s of data) {
    if (!s.sessions || !s.sessions.finished_at) continue;
    (by[s.session_id] ??= { date:s.sessions.started_at, sets:[] }).sets.push(s);
  }
  const rows = Object.values(by).map(g => {
    const top = g.sets.reduce((a, b) =>
      Number(b.weight_kg) > Number(a.weight_kg) || (Number(b.weight_kg) === Number(a.weight_kg) && b.reps > a.reps) ? b : a);
    return { date:g.date, top, v:Math.max(...g.sets.map(s => epley(s.weight_kg, s.reps))) };
  }).sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!rows.length) { box.innerHTML = `<p class="empty">No finished sessions with this exercise yet.</p>`; return; }
  box.innerHTML = `
    <section class="panel">
      <h2>Estimated 1RM</h2>
      ${chart(rows.slice(-20))}
    </section>
    <section class="panel tablewrap">
      <table>
        <thead><tr><th>Date</th><th class="r">Top set</th><th class="r">Est. 1RM</th></tr></thead>
        <tbody>${rows.slice().reverse().slice(0, 15).map(r => `
          <tr><td>${fmtDate(r.date)}</td><td class="r">${fmtW(r.top.weight_kg)} × ${r.top.reps}</td><td class="r">${Math.round(r.v)} kg</td></tr>`).join("")}
        </tbody>
      </table>
    </section>`;
}

function renderSetup() {
  app.innerHTML = `
    <section class="panel setup">
      <h1 class="h">Connect Supabase</h1>
      <p>This page needs your Supabase details before it can save anything.</p>
      <ol>
        <li>Run <code>schema.sql</code> in the Supabase SQL Editor.</li>
        <li>Copy the Project URL and anon (publishable) key from Project Settings, API.</li>
        <li>Paste them into <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> at the top of the script in <code>index.html</code>.</li>
      </ol>
    </section>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-start],[data-act]");
  if (!t || !db) return;
  if (t.dataset.view) { S.view = t.dataset.view; render(); return; }
  if (t.dataset.start) {
    if (t.dataset.busy) return;
    t.dataset.busy = "1";
    start(t.dataset.start).finally(() => delete t.dataset.busy);
    return;
  }
  switch (t.dataset.act) {
    case "tick": tick(t.closest(".set")); break;
    case "finish": finish(); break;
    case "discard": discard(false); break;
    case "add30":
      T.end = Math.max(T.end, Date.now()) + 30000;
      $("#timer").classList.remove("over"); $("#timer-label").textContent = "Rest";
      clearInterval(T.id); T.id = setInterval(tickTimer, 250); tickTimer();
      break;
    case "skip": stopTimer(); break;
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "ramp") { S.ramp = t.checked; localStorage.setItem("gymlog_ramp", S.ramp ? "1" : "0"); }
  else if (t.id === "exsel") { S.progEx = t.value; renderProgress(); }
  else if (t.matches(".set.done .num")) saveRow(t.closest(".set"), false); // edit a logged set
});

/* ---------- boot ---------- */
(async function init() {
  if (SUPABASE_URL.startsWith("PASTE") || SUPABASE_ANON_KEY.startsWith("PASTE") || !window.supabase) return renderSetup();
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(SUPABASE_URL.trim())) {
    renderSetup();
    app.insertAdjacentHTML("afterbegin", `<p class="empty">SUPABASE_URL must be your Project URL, like https://abcd1234.supabase.co. It currently holds something else.</p>`);
    return;
  }
  try { db = window.supabase.createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim()); }
  catch { return renderSetup(); }
  try {
    await Promise.all([resume(), loadNext()]);
  } catch {
    toast("Could not reach Supabase. Check your connection.");
  }
  render();
})();
</script>
</body>
</html>
